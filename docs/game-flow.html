<!DOCTYPE html>
<html lang="zh-CN" style="margin:0;padding:0;">
<title>一箭又一箭 · 游戏流程与架构图</title>
<body style="margin:0;padding:24px;background:#F5F1E8;font-family:'Microsoft YaHei','PingFang SC',sans-serif;color:#343A40;">
<h1 style="font-size:26px;color:#1B46A0;margin:0 0 4px;">一箭又一箭 · 游戏流程与架构图</h1>
<p style="font-size:14px;margin:0 0 18px;color:#6b6f76;">点击式箭头解谜小游戏（Python + Pygame）｜状态机 / 点击判定流程 / 代码模块架构</p>

<!-- ============ ① 游戏状态流程 ============ -->
<div style="background:#fff;border:1px solid #D0C5B0;border-radius:14px;padding:14px 14px 6px;margin-bottom:18px;">
  <div style="font-size:16px;font-weight:700;color:#1B46A0;margin-bottom:8px;">① 游戏状态流程（状态机）</div>
  <svg viewBox="0 0 960 255" width="100%" role="img" aria-label="游戏状态流程">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/>
      </marker>
      <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8a8f96"/>
      </marker>
    </defs>

    <!-- 状态节点 -->
    <rect x="30"  y="100" width="160" height="58" rx="14" fill="#2F6FED"/>
    <text x="110" y="131" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">开始界面</text>

    <rect x="300" y="100" width="170" height="58" rx="14" fill="#2F6FED"/>
    <text x="385" y="131" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">游戏界面</text>

    <rect x="600" y="30" width="170" height="58" rx="14" fill="#229E62"/>
    <text x="685" y="61" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">通关界面</text>

    <rect x="600" y="180" width="170" height="58" rx="14" fill="#DE4242"/>
    <text x="685" y="211" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">失败界面</text>

    <!-- 迁移箭头 -->
    <line x1="190" y1="129" x2="296" y2="129" stroke="#2F6FED" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="243" y="118" text-anchor="middle" font-size="13" fill="#343A40">开始游戏</text>

    <line x1="385" y1="100" x2="615" y2="88" stroke="#2F6FED" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="500" y="80" text-anchor="middle" font-size="13" fill="#229E62">清除全部箭头</text>

    <line x1="385" y1="158" x2="615" y2="180" stroke="#2F6FED" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="500" y="182" text-anchor="middle" font-size="13" fill="#DE4242">失误耗尽</text>

    <!-- 通关 → 游戏（下一关） -->
    <path d="M600,45 C530,45 500,80 472,96" fill="none" stroke="#229E62" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="528" y="58" text-anchor="middle" font-size="12.5" fill="#229E62">进入下一关</text>

    <!-- 失败 → 游戏（重新开始本关） -->
    <path d="M600,219 C520,219 490,190 466,160" fill="none" stroke="#DE4242" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="524" y="238" text-anchor="middle" font-size="12.5" fill="#DE4242">重新开始（本关）</text>

    <!-- 游戏界面 重新开始 自环 -->
    <path d="M385,100 C385,78 452,78 452,98" fill="none" stroke="#8a8f96" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="418" y="72" text-anchor="middle" font-size="12.5" fill="#8a8f96">重新开始（重置本关）</text>

    <!-- 返回主页（通关/失败均可） -->
    <path d="M685,30 C685,12 110,12 110,96" fill="none" stroke="#8a8f96" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrGray)"/>
    <text x="400" y="14" text-anchor="middle" font-size="12.5" fill="#8a8f96">返回主页（通关 / 失败界面均可，游戏中按 Esc 亦可）</text>
  </svg>
</div>

<!-- ============ ② 点击判定流程 ============ -->
<div style="background:#fff;border:1px solid #D0C5B0;border-radius:14px;padding:14px 14px 6px;margin-bottom:18px;">
  <div style="font-size:16px;font-weight:700;color:#1B46A0;margin-bottom:8px;">② 点击判定流程（路径检测与碰撞）</div>
  <svg viewBox="0 0 960 215" width="100%" role="img" aria-label="点击判定流程">
    <defs>
      <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/>
      </marker>
    </defs>

    <rect x="15"  y="80" width="130" height="58" rx="12" fill="#2F6FED"/>
    <text x="80" y="111" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">点击箭头</text>

    <rect x="185" y="72" width="170" height="74" rx="12" fill="#E8EEFB" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="270" y="103" text-anchor="middle" fill="#1B46A0" font-size="15" font-weight="700">路径检测</text>
    <text x="270" y="125" text-anchor="middle" fill="#5a6370" font-size="12.5">沿方向逐格前进到边界</text>

    <polygon points="440,109 485,80 530,109 485,138" fill="#FDF3D7" stroke="#C99A2E" stroke-width="1.5"/>
    <text x="485" y="105" text-anchor="middle" fill="#8a6d1a" font-size="13.5" font-weight="700">前方有箭头？</text>
    <text x="485" y="124" text-anchor="middle" fill="#8a6d1a" font-size="12">（同行/同列）</text>

    <!-- 否 → 畅通 -->
    <line x1="530" y1="94" x2="612" y2="55" stroke="#229E62" stroke-width="2.5" marker-end="url(#arr2)"/>
    <text x="572" y="62" text-anchor="middle" font-size="13.5" fill="#229E62" font-weight="700">否·畅通</text>

    <rect x="615" y="28" width="165" height="58" rx="12" fill="#E9F7F0" stroke="#229E62" stroke-width="1.5"/>
    <text x="697" y="59" text-anchor="middle" fill="#1c7a4c" font-size="14" font-weight="700">飞出动画（加速+淡出）</text>

    <line x1="780" y1="57" x2="846" y2="57" stroke="#229E62" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="850" y="28" width="96" height="58" rx="12" fill="#229E62"/>
    <text x="898" y="59" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">消除箭头</text>
    <text x="898" y="78" text-anchor="middle" fill="#d9efe3" font-size="11.5">数量-1 → 通关判定</text>

    <!-- 是 → 被阻挡 -->
    <line x1="530" y1="124" x2="612" y2="160" stroke="#DE4242" stroke-width="2.5" marker-end="url(#arr2)"/>
    <text x="572" y="154" text-anchor="middle" font-size="13.5" fill="#DE4242" font-weight="700">是·被阻挡</text>

    <rect x="615" y="135" width="165" height="58" rx="12" fill="#FDEBEB" stroke="#DE4242" stroke-width="1.5"/>
    <text x="697" y="159" text-anchor="middle" fill="#a33030" font-size="14" font-weight="700">晃动变红 + “被阻挡！”</text>
    <text x="697" y="179" text-anchor="middle" fill="#a33030" font-size="12">箭头不消除</text>

    <line x1="780" y1="164" x2="846" y2="164" stroke="#DE4242" stroke-width="2.5" marker-end="url(#arr2)"/>
    <rect x="850" y="135" width="96" height="58" rx="12" fill="#DE4242"/>
    <text x="898" y="159" text-anchor="middle" fill="#fff" font-size="13.5" font-weight="700">失误-1</text>
    <text x="898" y="178" text-anchor="middle" fill="#f6d6d6" font-size="11.5">归零 → 失败</text>
  </svg>
</div>

<!-- ============ ③ 代码模块架构 ============ -->
<div style="background:#fff;border:1px solid #D0C5B0;border-radius:14px;padding:14px 14px 6px;">
  <div style="font-size:16px;font-weight:700;color:#1B46A0;margin-bottom:8px;">③ 代码模块架构（逻辑与界面分离，便于测试）</div>
  <svg viewBox="0 0 960 190" width="100%" role="img" aria-label="代码模块架构">
    <defs>
      <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2F6FED"/>
      </marker>
      <marker id="arr3Gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8a8f96"/>
      </marker>
    </defs>

    <!-- 表现层 -->
    <rect x="330" y="15" width="300" height="58" rx="12" fill="#2F6FED"/>
    <text x="480" y="39" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">main.py（表现层）</text>
    <text x="480" y="60" text-anchor="middle" fill="#dbe5fb" font-size="12">pygame 界面 / 动画 / 事件与主循环</text>

    <!-- 逻辑层 -->
    <rect x="330" y="115" width="300" height="58" rx="12" fill="#E8EEFB" stroke="#2F6FED" stroke-width="1.5"/>
    <text x="480" y="139" text-anchor="middle" fill="#1B46A0" font-size="15" font-weight="700">game_logic.py（逻辑层）</text>
    <text x="480" y="160" text-anchor="middle" fill="#5a6370" font-size="12">路径检测 / 消除 / 失误 / 状态机 / 求解器（不依赖 pygame）</text>

    <line x1="480" y1="73" x2="480" y2="111" stroke="#2F6FED" stroke-width="2.5" marker-end="url(#arr3)"/>
    <text x="492" y="96" font-size="12" fill="#5a6370">调用</text>

    <!-- 数据层 -->
    <rect x="60" y="115" width="200" height="58" rx="12" fill="#F3EEDD" stroke="#C99A2E" stroke-width="1.5"/>
    <text x="160" y="139" text-anchor="middle" fill="#8a6d1a" font-size="15" font-weight="700">levels.py（数据层）</text>
    <text x="160" y="160" text-anchor="middle" fill="#7a6a3a" font-size="12">3 关关卡数据（可扩展）</text>

    <line x1="260" y1="144" x2="326" y2="144" stroke="#C99A2E" stroke-width="2.5" marker-end="url(#arr3Gray)"/>
    <text x="293" y="134" text-anchor="middle" font-size="12" fill="#8a6d1a">读取</text>

    <!-- 测试层 -->
    <rect x="700" y="115" width="200" height="58" rx="12" fill="#E9F7F0" stroke="#229E62" stroke-width="1.5"/>
    <text x="800" y="139" text-anchor="middle" fill="#1c7a4c" font-size="15" font-weight="700">tests.py（测试层）</text>
    <text x="800" y="160" text-anchor="middle" fill="#2c6e4d" font-size="12">T01~T06 + 关卡可解性校验</text>

    <path d="M700,144 L650,144 L650,90 L634,90" fill="none" stroke="#229E62" stroke-width="2.5" marker-end="url(#arr3)"/>
    <path d="M700,144 L650,144 L650,160 L580,160" fill="none" stroke="#229E62" stroke-width="2.5" marker-end="url(#arr3)"/>
    <text x="648" y="120" text-anchor="middle" font-size="12" fill="#2c6e4d">测试</text>
  </svg>
  <p style="font-size:12.5px;color:#8a8f96;margin:6px 0 8px;">图注：本图为项目结构与运行逻辑的示意，蓝色=主流程，绿色=成功/通过，红色=失败/碰撞，灰色=辅助操作。</p>
</div>
</body>
</html>
